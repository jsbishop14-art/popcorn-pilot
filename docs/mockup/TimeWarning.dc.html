<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popcorn Pilot time warning overlay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16264A}
a{color:#FFC94A}a:hover{color:#FFE08A}
button{font:inherit;cursor:pointer}
.tv{width:1280px;height:720px;box-sizing:border-box;position:relative;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#FFFFFF}
.fd{font-family:Fredoka,Nunito,sans-serif}
.blob{position:absolute;border-radius:50%;background:#1E3260}
.kbtn{display:flex;align-items:center;justify-content:center;gap:14px;height:72px;padding:0 34px;border-radius:36px;border:6px solid transparent;background:#FFFFFF;color:#16264A;font-family:Fredoka,Nunito,sans-serif;font-size:28px;font-weight:700;box-shadow:0 8px 0 #0B1630}
.kbtn.f{border-color:#FFC94A;transform:scale(1.05);box-shadow:0 10px 0 #0B1630,0 0 0 6px rgba(255,201,74,.35)}
.kbtn.ghost{background:#1E3260;color:#FFFFFF}
.pill{display:flex;align-items:center;gap:14px;background:#FFFFFF;color:#16264A;border-radius:40px;padding:10px 26px 10px 12px}
.bar{width:200px;height:16px;border-radius:8px;background:#E4E9F2;overflow:hidden}
.hint{font-size:18px;font-weight:700;color:#D6DDEA}
</style>
</helmet>
<div class="tv" style="background: #2B3D63">

<div style="position: absolute; inset: 0; background: #2B3D63; display: flex; align-items: center; justify-content: center"><span style="font-size: 22px; font-weight: 700; color: #C5CEDF">[Show playing in Netflix]</span></div>
<div style="position: absolute; top: 40px; right: 40px; width: 470px; background: #FFFFFF; color: #16264A; border-radius: 30px; padding: 22px 26px; display: flex; gap: 20px; align-items: center; box-shadow: 0 18px 40px rgba(0,0,0,0.4)" role="alert">
  <span style="width: 86px; height: 86px; border-radius: 43px; background: #FDECEA; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#A1261A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #A1261A; flex-shrink: 0"><path d="M6 3h12M6 21h12M7 3c0 6 10 6 10 9s-10 3-10 9M17 3c0 6-10 6-10 9"></path></svg></span>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <span class="fd" style="font-size: 32px; font-weight: 700">5 minutes left!</span>
    <span style="font-size: 19px; font-weight: 700; color: #2B3D63">This is the last episode for today.</span>
    <div style="width: 300px; height: 14px; border-radius: 7px; background: #E4E9F2"><div style="width: 9%; height: 14px; border-radius: 7px; background: hsl(10, 72%, 45%)"></div></div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
