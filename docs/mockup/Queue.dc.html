<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popcorn Pilot live queue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F9}
a{color:#0F1B33}a:hover{color:#2B3D63}
button,input,select{font:inherit}
button{cursor:pointer}
.scr{width:390px;box-sizing:border-box;overflow:hidden;background:#F3F5F9;font-family:Nunito,system-ui,sans-serif;color:#0F1B33;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:20px 16px 12px}
.h1{margin:0;font-family:Fredoka,Nunito,sans-serif;font-size:24px;font-weight:600;flex-grow:1}
.h2{margin:0;font-family:Fredoka,Nunito,sans-serif;font-size:17px;font-weight:600}
.icb{width:44px;height:44px;border-radius:22px;border:0;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(15,27,51,.12);flex-shrink:0}
.main{flex-grow:1;display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.card{background:#FFFFFF;border-radius:18px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,27,51,.1);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lft{display:flex;align-items:center;gap:12px;min-width:0}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.t{font-size:15px;font-weight:800}
.s{font-size:13px;font-weight:700;color:#4A5878}
.lbl{font-size:12px;font-weight:800;color:#4A5878;text-transform:uppercase;letter-spacing:.6px}
.btn{height:44px;padding:0 16px;border-radius:12px;border:0;background:#F3F5F9;font-size:14px;font-weight:800;color:#0F1B33;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pri{background:#FFC94A}
.dark{background:#0F1B33;color:#FFFFFF}
.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D6DDEA;background:#FFFFFF;font-size:13px;font-weight:800;color:#0F1B33;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#0F1B33;color:#FFFFFF;border-color:#0F1B33}
.tog{width:50px;height:30px;border-radius:15px;border:0;padding:0;background:#C5CEDF;position:relative;flex-shrink:0}
.tog.on{background:#2E9E6B}
.tog span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#FFFFFF}
.tog.on span{left:23px}
.thumb{width:48px;height:48px;border-radius:10px;flex-shrink:0}
.poster{width:44px;height:66px;border-radius:8px;flex-shrink:0}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:9px;background:#0F1B33;color:#FFFFFF;white-space:nowrap}
.soft{background:#F3F5F9;color:#0F1B33}
.ok{background:#E3F4EC;color:#1F6B49}
.warn{background:#FDECEA;color:#A1261A}
.field{height:46px;border-radius:12px;border:1px solid #D6DDEA;padding:0 12px;background:#FFFFFF;font-size:15px;font-weight:700;color:#0F1B33;width:100%;box-sizing:border-box}
.sep{border-top:1px solid #E4E9F2}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #E4E9F2;padding:8px 4px 22px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;text-decoration:none;color:#4A5878;font-size:11px;font-weight:700}
.nav a.on{color:#0F1B33;font-weight:800}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>
<div class="scr" style="height: 844px">
<header class="top"><button class="icb" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M15 18l-6-6 6-6"></path></svg></button><h1 class="h1">Live queue</h1></header>
<main class="main">

</div>
<div class="row"><span class="lbl">Up next · Saturday Cartoons</span><div class="chips"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #4A5878; flex-shrink: 0"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"></path><path d="M20 4v5h-5M4 20v-5h5"></path></svg><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #4A5878; flex-shrink: 0"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"></path></svg></div></div>
<div class="card" style="gap: 0">
  <div class="row" style="padding: 8px 0"><div class="lft"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #9AA6BD; flex-shrink: 0"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg><div class="poster" style="background: #7FC8A9"></div><div class="col"><span class="t">Ocean Friends</span><span class="s">Hulu · Stay on show</span></div></div>
<button class="chip">Edit <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg></button></div><div class="sep"></div><div class="row" style="padding: 8px 0"><div class="lft"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #9AA6BD; flex-shrink: 0"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg><div class="poster" style="background: #FF8A65"></div><div class="col"><span class="t">Big Truck Town</span><span class="s">Netflix · 45 min</span></div></div>
<button class="chip">Edit <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg></button></div><div class="sep"></div><div class="row" style="padding: 8px 0"><div class="lft"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #9AA6BD; flex-shrink: 0"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg><div class="poster" style="background: #FFC94A"></div><div class="col"><span class="t">Star Club</span><span class="s">Prime Video · Run indefinitely</span></div></div>
<button class="chip">Edit <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M9 6l6 6-6 6"></path></svg></button></div>
</div>
<button class="btn dark wide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #FFFFFF; flex-shrink: 0"><path d="M12 5v14M5 12h14"></path></svg> Add to queue</button>
</main>
