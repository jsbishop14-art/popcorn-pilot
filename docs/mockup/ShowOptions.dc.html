<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popcorn Pilot show options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F9}
a{color:#0F1B33}a:hover{color:#2B3D63}
button,input,select{font:inherit}
button{cursor:pointer}
.scr{width:390px;box-sizing:border-box;overflow:hidden;background:#F3F5F9;font-family:Nunito,system-ui,sans-serif;color:#0F1B33;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:20px 16px 12px}
.h1{margin:0;font-family:Fredoka,Nunito,sans-serif;font-size:24px;font-weight:600;flex-grow:1}
.h2{margin:0;font-family:Fredoka,Nunito,sans-serif;font-size:17px;font-weight:600}
.icb{width:44px;height:44px;border-radius:22px;border:0;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(15,27,51,.12);flex-shrink:0}
.main{flex-grow:1;display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.card{background:#FFFFFF;border-radius:18px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,27,51,.1);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lft{display:flex;align-items:center;gap:12px;min-width:0}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.t{font-size:15px;font-weight:800}
.s{font-size:13px;font-weight:700;color:#4A5878}
.lbl{font-size:12px;font-weight:800;color:#4A5878;text-transform:uppercase;letter-spacing:.6px}
.btn{height:44px;padding:0 16px;border-radius:12px;border:0;background:#F3F5F9;font-size:14px;font-weight:800;color:#0F1B33;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pri{background:#FFC94A}
.dark{background:#0F1B33;color:#FFFFFF}
.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D6DDEA;background:#FFFFFF;font-size:13px;font-weight:800;color:#0F1B33;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#0F1B33;color:#FFFFFF;border-color:#0F1B33}
.tog{width:50px;height:30px;border-radius:15px;border:0;padding:0;background:#C5CEDF;position:relative;flex-shrink:0}
.tog.on{background:#2E9E6B}
.tog span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#FFFFFF}
.tog.on span{left:23px}
.thumb{width:48px;height:48px;border-radius:10px;flex-shrink:0}
.poster{width:44px;height:66px;border-radius:8px;flex-shrink:0}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:9px;background:#0F1B33;color:#FFFFFF;white-space:nowrap}
.soft{background:#F3F5F9;color:#0F1B33}
.ok{background:#E3F4EC;color:#1F6B49}
.warn{background:#FDECEA;color:#A1261A}
.field{height:46px;border-radius:12px;border:1px solid #D6DDEA;padding:0 12px;background:#FFFFFF;font-size:15px;font-weight:700;color:#0F1B33;width:100%;box-sizing:border-box}
.sep{border-top:1px solid #E4E9F2}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #E4E9F2;padding:8px 4px 22px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;text-decoration:none;color:#4A5878;font-size:11px;font-weight:700}
.nav a.on{color:#0F1B33;font-weight:800}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>
<div class="scr" style="height: 844px">

<div style="flex-grow: 1; background: rgba(15,27,51,0.45); display: flex; flex-direction: column; justify-content: flex-end">
  <section style="background: #F3F5F9; border-radius: 26px 26px 0 0; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 12px" aria-label="How much of this show">
    <span style="width: 44px; height: 5px; border-radius: 3px; background: #C5CEDF; align-self: center"></span>
    <div class="lft"><div class="poster" style="background: #8FB3FF"></div><div class="col"><span class="h2">How much Rocket Pals?</span><span class="s">Netflix · starts at S2 E4</span></div></div>
    <div role="radiogroup" aria-label="Play mode" style="display: flex; flex-direction: column; gap: 10px">
      <button role="radio" aria-checked="true" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 2px solid #0F1B33; text-align: left; width: 100%">
<span class="lft"><span style="width: 24px; height: 24px; border-radius: 12px; border: 7px solid #0F1B33; box-sizing: border-box; flex-shrink: 0"></span><span class="col"><span class="t">Number of episodes</span><span class="s">Then move to the next title</span></span></span><span style="display: flex; align-items: center; gap: 10px"><span class="icb" style="width: 36px; height: 36px; box-shadow: none; background: #F3F5F9">−</span><span class="fd" style="font-size: 22px; font-weight: 600">3</span><span class="icb" style="width: 36px; height: 36px; box-shadow: none; background: #F3F5F9">+</span></span></button><button role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 2px solid #E4E9F2; text-align: left; width: 100%">
<span class="lft"><span style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid #9AA6BD; box-sizing: border-box; flex-shrink: 0"></span><span class="col"><span class="t">Stay on show</span><span class="s">Keep playing episodes until the playlist is stopped</span></span></span></button><button role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 2px solid #E4E9F2; text-align: left; width: 100%">
<span class="lft"><span style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid #9AA6BD; box-sizing: border-box; flex-shrink: 0"></span><span class="col"><span class="t">Time on show</span><span class="s">Play for a set time, stop at the end of an episode</span></span></span><span class="chip">45 min</span></button><button role="radio" aria-checked="false" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #FFFFFF; border: 2px solid #E4E9F2; text-align: left; width: 100%">
<span class="lft"><span style="width: 24px; height: 24px; border-radius: 12px; border: 2px solid #9AA6BD; box-sizing: border-box; flex-shrink: 0"></span><span class="col"><span class="t">Run indefinitely</span><span class="s">Keep going, ignore playlist order</span></span></span></button>
    </div>
    <button class="btn pri wide">Done</button>
  </section>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
