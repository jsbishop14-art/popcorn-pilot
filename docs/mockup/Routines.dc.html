<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popcorn Pilot routines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3F5F9}
a{color:#0F1B33}a:hover{color:#2B3D63}
button,input,select{font:inherit}
button{cursor:pointer}
.scr{width:390px;box-sizing:border-box;overflow:hidden;background:#F3F5F9;font-family:Nunito,system-ui,sans-serif;color:#0F1B33;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:20px 16px 12px}
.h1{margin:0;font-family:Fredoka,Nunito,sans-serif;font-size:24px;font-weight:600;flex-grow:1}
.h2{margin:0;font-family:Fredoka,Nunito,sans-serif;font-size:17px;font-weight:600}
.icb{width:44px;height:44px;border-radius:22px;border:0;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(15,27,51,.12);flex-shrink:0}
.main{flex-grow:1;display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.card{background:#FFFFFF;border-radius:18px;padding:14px 16px;box-shadow:0 1px 3px rgba(15,27,51,.1);display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lft{display:flex;align-items:center;gap:12px;min-width:0}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.t{font-size:15px;font-weight:800}
.s{font-size:13px;font-weight:700;color:#4A5878}
.lbl{font-size:12px;font-weight:800;color:#4A5878;text-transform:uppercase;letter-spacing:.6px}
.btn{height:44px;padding:0 16px;border-radius:12px;border:0;background:#F3F5F9;font-size:14px;font-weight:800;color:#0F1B33;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pri{background:#FFC94A}
.dark{background:#0F1B33;color:#FFFFFF}
.wide{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:18px;border:1px solid #D6DDEA;background:#FFFFFF;font-size:13px;font-weight:800;color:#0F1B33;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#0F1B33;color:#FFFFFF;border-color:#0F1B33}
.tog{width:50px;height:30px;border-radius:15px;border:0;padding:0;background:#C5CEDF;position:relative;flex-shrink:0}
.tog.on{background:#2E9E6B}
.tog span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#FFFFFF}
.tog.on span{left:23px}
.thumb{width:48px;height:48px;border-radius:10px;flex-shrink:0}
.poster{width:44px;height:66px;border-radius:8px;flex-shrink:0}
.badge{font-size:12px;font-weight:800;padding:3px 9px;border-radius:9px;background:#0F1B33;color:#FFFFFF;white-space:nowrap}
.soft{background:#F3F5F9;color:#0F1B33}
.ok{background:#E3F4EC;color:#1F6B49}
.warn{background:#FDECEA;color:#A1261A}
.field{height:46px;border-radius:12px;border:1px solid #D6DDEA;padding:0 12px;background:#FFFFFF;font-size:15px;font-weight:700;color:#0F1B33;width:100%;box-sizing:border-box}
.sep{border-top:1px solid #E4E9F2}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #E4E9F2;padding:8px 4px 22px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;text-decoration:none;color:#4A5878;font-size:11px;font-weight:700}
.nav a.on{color:#0F1B33;font-weight:800}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</helmet>
<div class="scr" style="height: 844px">
<header class="top"><button class="icb" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M15 18l-6-6 6-6"></path></svg></button><h1 class="h1">Routines</h1></header>
<main class="main">

<span class="s">One button sets the TV, profile, volume, playlist and timer.</span>
<div class="card"><div class="row"><div class="lft"><span class="thumb" style="background: #FFF3C4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span><div class="col"><span class="t">Morning cartoons</span><span class="s">Weekdays 7:00 AM · Living room · Kid</span></div></div>
<button class="btn pri" style="height: 40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M8 5l12 7-12 7z" fill="currentColor"></path></svg> Run</button></div></div><div class="card"><div class="row"><div class="lft"><span class="thumb" style="background: #FFF3C4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg></span><div class="col"><span class="t">Movie night</span><span class="s">Manual · Living room · Family</span></div></div>
<button class="btn pri" style="height: 40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M8 5l12 7-12 7z" fill="currentColor"></path></svg> Run</button></div></div><div class="card"><div class="row"><div class="lft"><span class="thumb" style="background: #FFF3C4; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></span><div class="col"><span class="t">Bedtime wind-down</span><span class="s">Daily 7:00 PM · Guest room · Kid</span></div></div>
<button class="btn pri" style="height: 40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M8 5l12 7-12 7z" fill="currentColor"></path></svg> Run</button></div></div>
<button class="btn dark wide"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #FFFFFF; flex-shrink: 0"><path d="M12 5v14M5 12h14"></path></svg> New routine</button>
</main>
<nav class="nav" aria-label="Main">
<a href="#home" class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #4A5878; flex-shrink: 0"><path d="M3 11l9-7 9 7v9H3z"></path></svg>Home</a>
<a href="#browse" class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #4A5878; flex-shrink: 0"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Browse</a>
<a href="#playlists" class="on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1B33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #0F1B33; flex-shrink: 0"><path d="M4 6h12M4 12h12M4 18h8M18 15v6l4-3z"></path></svg>Playlists</a>
<a href="#profiles" class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #4A5878; flex-shrink: 0"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Profiles</a>
<a href="#settings" class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A5878" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #4A5878; flex-shrink: 0"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Settings</a>
</nav>
</div>
</x-dc>

</body>
</html>
