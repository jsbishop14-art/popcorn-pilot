<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popcorn Pilot time is up screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#16264A}
a{color:#FFC94A}a:hover{color:#FFE08A}
button{font:inherit;cursor:pointer}
.tv{width:1280px;height:720px;box-sizing:border-box;position:relative;overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:#FFFFFF}
.fd{font-family:Fredoka,Nunito,sans-serif}
.blob{position:absolute;border-radius:50%;background:#1E3260}
.kbtn{display:flex;align-items:center;justify-content:center;gap:14px;height:72px;padding:0 34px;border-radius:36px;border:6px solid transparent;background:#FFFFFF;color:#16264A;font-family:Fredoka,Nunito,sans-serif;font-size:28px;font-weight:700;box-shadow:0 8px 0 #0B1630}
.kbtn.f{border-color:#FFC94A;transform:scale(1.05);box-shadow:0 10px 0 #0B1630,0 0 0 6px rgba(255,201,74,.35)}
.kbtn.ghost{background:#1E3260;color:#FFFFFF}
.pill{display:flex;align-items:center;gap:14px;background:#FFFFFF;color:#16264A;border-radius:40px;padding:10px 26px 10px 12px}
.bar{width:200px;height:16px;border-radius:8px;background:#E4E9F2;overflow:hidden}
.hint{font-size:18px;font-weight:700;color:#D6DDEA}
</style>
</helmet>
<div class="tv" style="background: #0F1B33">
<div class="blob" style="top: -90px; right: -60px; width: 320px; height: 320px" aria-hidden="true"></div><div class="blob" style="bottom: -120px; left: -80px; width: 360px; height: 360px" aria-hidden="true"></div>
<div style="position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center">
  <span style="width: 170px; height: 170px; border-radius: 85px; background: #1E3260; display: flex; align-items: center; justify-content: center"><svg width="96" height="96" viewBox="0 0 24 24" fill="#FFC94A" stroke="#FFC94A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #FFC94A; flex-shrink: 0"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></span>
  <h1 class="fd" style="margin: 0; font-size: 60px; font-weight: 700">All done for today!</h1>
  <span style="font-size: 26px; font-weight: 700; color: #D6DDEA">TV turns off in 10 seconds. See you tomorrow, [Kid name].</span>
  <div style="display: flex; gap: 24px; margin-top: 10px">
    <button class="kbtn f"><svg width="34" height="34" viewBox="0 0 24 24" fill="#FFC94A" stroke="#16264A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #16264A; flex-shrink: 0"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z"></path></svg> Earn more time</button>
    <button class="kbtn"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#16264A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #16264A; flex-shrink: 0"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg> Ask a grown-up</button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1280, "height": 720}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
